plugins {
    id 'java-library'
    id 'org.cadixdev.licenser' version '0.6.1'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

group = "io.github.matyrobbrt"
archivesBaseName = "curseforgeapi"
version = "${version}"

repositories {
    jcenter()
    mavenCentral()
}

dependencies {
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.16'
    implementation group: 'com.github.mizosoft.methanol', name: 'methanol', version: '1.8.0'

    testImplementation group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.16'
    testImplementation group: 'io.github.cdimascio', name: 'dotenv-java', version: '3.1.0'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.22.0'
    
    def jupiterVersion = '5.8.2'
    
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: jupiterVersion
}

license {
    header = file("$rootDir/licenseheader.txt")
    properties {
        name = 'Matyrobbrt'
        year = 2022
    }

    include '**/*.java'
}

java {
    withJavadocJar()
    withSourcesJar()
}

test {
    useJUnitPlatform()
}

allprojects {
    compileJava {
        options.release = 17
    }
    javadoc.options.addStringOption('Xdoclint:none', '-quiet')
    
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    publishing {
        publications{
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = "curseforgeapi"
                    description = "A Java wrapper for the CurseForge API"
                    url = 'https://github.com/Matyrobbrt/CurseForgeJavaAPI'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://www.opensource.org/licenses/mit-license.php'
                        }
                    }
                    developers {
                        developer {
                            id = 'matyrobbrt'
                            name = 'Matyrobbrt'
                            email = 'matyrobbrt@gmail.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:git:github.com/matyrobbrt/curseforgejavaapi.git'
                        developerConnection = 'scm:git:ssh://github.com/Matyrobbrt/CurseForgeJavaAPI.git'
                        url = 'https://github.com/Matyrobbrt/CurseForgeJavaAPI'
                    }
                }
            }
        }
    }
    signing {
        sign publishing.publications.mavenJava
    }
    nexusPublishing {
        repositories {
            // see https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#configuration
            sonatype {
                it.nexusUrl.set(URI.create('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            }
        }
    }
    if (project.hasProperty("close")) {
        tasks.publish.finalizedBy closeAndReleaseRepository
    }
    jar {
        destinationDirectory = file("./build/libs/${version}/")
    }
    javadocJar {
        destinationDirectory = file("./build/libs/${version}/")
    }
    sourcesJar {
        destinationDirectory = file("./build/libs/${version}/")
    }
}

compileJava.options.encoding = "UTF-8"
